name: Custom ML algorithm (APRL)

on:
  push:
    paths:
      - "src/aprl/**"
      - "tests/**"
      - "examples/aprl_quickstart.py"
      - "benchmarks/benchmark_aprl.py"
      - "pyproject.toml"
      - ".github/workflows/aprl.yml"
  pull_request:
    paths:
      - "src/aprl/**"
      - "tests/**"
      - "examples/aprl_quickstart.py"
      - "benchmarks/benchmark_aprl.py"
      - "pyproject.toml"
      - ".github/workflows/aprl.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples/aprl_quickstart.py benchmarks/benchmark_aprl.py
      - run: python -m pytest
